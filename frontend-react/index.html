<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrackFarm Poultry Record Keeping</title>
    <meta name="description" content="Digital record keeping for Nigerian poultry farmers. Track mortality, feed, eggs, vaccinations, and profit — all in one place." />
    <link rel="icon" type="image/jpeg" href="/images/loadingimg.jpg" />
    <!-- Installable app (PWA): see public/manifest.json and public/sw.js -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Landing page only: start downloading the hero image (the largest thing
         on screen) immediately, instead of after the app's JavaScript runs. -->
    <script>
      if (location.pathname === '/') {
        var heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.href = '/images/Gemini_Generated_Image_6mz3jr6mz3jr6mz3.webp';
        heroPreload.fetchPriority = 'high';
        document.head.appendChild(heroPreload);
      }
    </script>
    <meta name="theme-color" content="#09120e" />
    <link rel="apple-touch-icon" href="/icon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TrackFarm" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('trackfarm_theme') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

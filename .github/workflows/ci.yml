name: CI

# Runs on every PR regardless of target branch. Plans against prod since
# that's the only account this pipeline ever touches -- beta deploys stay
# fully manual (see infra/terraform.tfvars's deploy_custom_domain comment
# and infra/prod.tfvars for why the two accounts can't share one apply).
on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm run build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
        working-directory: frontend-react
      - run: npm run build
        working-directory: frontend-react

  terraform:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npm run build
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend-react

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - run: terraform init -backend-config=backend-configs/prod.hcl
        working-directory: infra
      - run: terraform validate
        working-directory: infra
      # prod.tfvars is gitignored (infra/terraform.tfvars.example explains
      # why -- it holds a few real test-recipient email addresses) and so
      # doesn't exist in this checkout. Its non-sensitive values are repo
      # variables; the one actually-personal value is a repo secret.
      - run: |
          terraform plan \
            -var='aws_account_id=${{ vars.AWS_ACCOUNT_ID }}' \
            -var='environment=prod' \
            -var='project_name=${{ vars.PROJECT_NAME }}' \
            -var='domain_name=${{ vars.DOMAIN_NAME }}' \
            -var='ses_sender_email=${{ vars.SES_SENDER_EMAIL }}' \
            -var='ses_test_recipient_emails=${{ secrets.SES_TEST_RECIPIENT_EMAILS }}'
        working-directory: infra
